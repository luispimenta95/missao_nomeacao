name: Tutory Relatorios

# Reforço dos jobs da Tutory. O disparo principal é o cron da Hostinger
# (scripts/instalar-cron-scheduler.sh, chamado no deploy), que roda
# `php artisan schedule:run` todo minuto. tutory:executar-agendados
# recupera o que passou do horário e ainda não concluiu naquele dia.
#
# O schedule do GitHub é best-effort: no pico da hora o evento é
# descartado e nenhuma run aparece em Actions. Por isso o cron abaixo
# evita o minuto 0 e só chama o comando de catch-up, duas vezes por hora.
# Horários em UTC (Brasília = UTC-3, sem horário de verão).

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      comando:
        description: Comando artisan a executar na Hostinger
        type: choice
        required: true
        default: tutory:executar-agendados
        options:
          - tutory:executar-agendados
          - tutory:sincronizar-alunos
          - tutory:baixar-relatorios --periodo=1 --se-pendente
          - tutory:baixar-relatorios --periodo=2 --se-pendente
          - tutory:baixar-relatorios --periodo=1
          - tutory:baixar-relatorios --periodo=2
          - tutory:liberar-periodos-pdf
          - tutory:scheduler-status

concurrency:
  group: tutory-relatorios
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Escolher comando
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CMD: ${{ github.event.inputs.comando }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CMD="$INPUT_CMD"
          else
            CMD="tutory:executar-agendados"
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Vai executar: php artisan $CMD"

      - name: SSH na Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 3h
          script_stop: true
          envs: ARTISAN_CMD
          script: |
            set -euo pipefail
            cd domains/missaonomeacao.com.br/public_html/server
            php -d max_execution_time=0 -d memory_limit=512M artisan ${ARTISAN_CMD}
        env:
          ARTISAN_CMD: ${{ steps.pick.outputs.cmd }}

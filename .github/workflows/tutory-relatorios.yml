name: Tutory Relatorios

# Reforço dos horários da Tutory. O relógio que segura o minuto é o cron
# de todo minuto na Hostinger. Estes crons são UTC (Brasília = UTC−3).
# O artisan só executa se, em America/Sao_Paulo, o relógio estiver no
# minuto marcado ou nos 4 seguintes. Um atraso até 11:05 não dispara as 06:00.
#
#   06:00 BRT = 09:00 UTC  sync, todo dia
#   00:05 BRT = 03:05 UTC  liberar períodos, dias 1 e 16
#   10:30 BRT = 13:30 UTC  PDF, dia 16 (período 1) e dia 1 (período 2)
#   11:00–22:00 BRT        retentativa de hora em hora
#     11:00–20:00 BRT = 14:00–23:00 UTC no mesmo dia
#     21:00–22:00 BRT = 00:00–01:00 UTC no dia seguinte

on:
  schedule:
    - cron: "0-4 9 * * *"
    - cron: "5-9 3 1,16 * *"
    - cron: "30-34 13 16 * *"
    - cron: "30-34 13 1 * *"
    - cron: "0-4 14-23 16,17 * *"
    - cron: "0-4 0,1 17,18 * *"
    - cron: "0-4 14-23 1,2 * *"
    - cron: "0-4 0,1 2,3 * *"
  workflow_dispatch:
    inputs:
      comando:
        description: Comando artisan a executar na Hostinger
        type: choice
        required: true
        default: tutory:executar-agendados
        options:
          - tutory:executar-agendados
          - tutory:sincronizar-alunos
          - tutory:baixar-relatorios --periodo=1 --se-pendente
          - tutory:baixar-relatorios --periodo=2 --se-pendente
          - tutory:baixar-relatorios --periodo=1
          - tutory:baixar-relatorios --periodo=2
          - tutory:liberar-periodos-pdf
          - tutory:scheduler-status

concurrency:
  group: tutory-relatorios
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Escolher comando
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CMD: ${{ github.event.inputs.comando }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CMD="$INPUT_CMD"
          else
            CMD="tutory:executar-agendados"
          fi
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Vai executar: php artisan $CMD"

      - name: SSH na Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          command_timeout: 3h
          script_stop: true
          envs: ARTISAN_CMD
          script: |
            set -euo pipefail
            cd domains/missaonomeacao.com.br/public_html/server
            php -d max_execution_time=0 -d memory_limit=512M artisan ${ARTISAN_CMD}
        env:
          ARTISAN_CMD: ${{ steps.pick.outputs.cmd }}

name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_KEY }}
          ARGS: "-avzr --delete"
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          TARGET: "domains/missaonomeacao.com.br/public_html/server/"
          EXCLUDE: "/.git/, /node_modules/, /vendor/, /.env, /database/*.sqlite*, /storage/logs/, /storage/framework/cache/, /storage/framework/sessions/, /storage/framework/views/"
          SCRIPT_AFTER: |
            cd domains/missaonomeacao.com.br/public_html/server
            composer install --no-dev --no-interaction --optimize-autoloader
            if [ ! -f database/database.sqlite ]; then
              touch database/database.sqlite
            fi
            php artisan migrate --force --no-interaction

